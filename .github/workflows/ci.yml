name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Edge functions bundle and run
        run: npm run build:functions && node scripts/check-coach-bundle.mjs && node scripts/check-scan-bundle.mjs && node scripts/check-writer-bundle.mjs

  database:
    name: Migrations and access rules
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/db-local.sh apply
      - run: npm run db:test
      - name: Generated database types are up to date
        run: npm run gen:types && git diff --exit-code packages/contract/src/database.types.ts

  bundle:
    name: App bundles for iOS and Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bundle:check -w @quest/mobile
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
